<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ek Surprise Tumhare Liye 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1a3d; --plum:#5b2a86; --pink:#ff4f8b; --gold:#ffc83d; --mint:#2ec4b6; --bg1:#fff1f7; --bg2:#ffe0b8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 20% 10%,var(--bg1),transparent 55%),radial-gradient(circle at 80% 90%,var(--bg2),transparent 55%),#fff7ee;
  overflow-x:hidden;display:flex;flex-direction:column;align-items:center;
  padding:max(24px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom));
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
#balloons{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.balloon{position:absolute;bottom:-120px;width:48px;height:62px;border-radius:50% 50% 48% 48%;opacity:.9;animation:rise linear forwards}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:46px;background:rgba(0,0,0,.25)}
@keyframes rise{to{transform:translateY(-120vh) rotate(8deg)}}

main{position:relative;z-index:2;width:100%;max-width:460px;text-align:center}

/* ---- lock card ---- */
#gate{margin-top:6vh;background:#fff;border-radius:28px;padding:30px 24px;box-shadow:0 18px 50px rgba(91,42,134,.18)}
#gate .gift{font-size:64px;display:inline-block;animation:wob 2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
#gate h1{font-size:28px;margin:10px 0 6px}
#gate p{color:#6b5a7d;margin-bottom:20px;font-size:16px}
label{display:block;text-align:left;font-weight:600;font-size:15px;margin:12px 0 6px}
input[type=text],input[type=date]{
  width:100%;padding:14px 16px;border:2px solid #eadcf5;border-radius:14px;font:inherit;font-size:17px;color:var(--ink);background:#fcf9ff;
}
input:focus{outline:3px solid var(--gold);border-color:var(--plum)}
button{font:inherit;cursor:pointer;border:0}
.btn{margin-top:22px;width:100%;padding:15px;border-radius:16px;background:var(--pink);color:#fff;font-weight:700;font-size:18px;box-shadow:0 6px 0 #c42e63;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c42e63}
#err{min-height:24px;margin-top:14px;color:#d1274f;font-weight:600}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* ---- celebration ---- */
#party{display:none}
#party.on{display:block}
.photoWrap{position:relative;width:250px;height:333px;margin:34px auto 0}
.photoWrap::before{content:"";position:absolute;inset:-12px;border-radius:36px;
  background:conic-gradient(var(--pink),var(--gold),var(--mint),var(--plum),var(--pink));animation:spin 6s linear infinite}
.photoWrap::after{content:"";position:absolute;inset:-4px;border-radius:28px;background:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
#photo{position:absolute;inset:0;z-index:2;width:100%;height:100%;border-radius:24px;object-fit:cover;object-position:50% 85%;background:#f3e8ff;
  transform:scale(0);animation:pop .9s .1s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.crown{position:absolute;z-index:3;top:-52px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:54px}
#photoPick{display:none;margin-top:14px;font-size:14px;color:#6b5a7d}
#photoPick.show{display:block}

h2.hb{font-family:'Caveat',cursive;font-weight:700;font-size:46px;line-height:1.05;margin-top:30px;color:var(--plum)}
h2.hb .nm{display:block;font-size:58px;color:var(--pink)}
#age{margin-top:6px;font-weight:600;color:#8a6d1a}
#wish{margin:16px auto 0;min-height:96px;max-width:380px;font-size:18px;line-height:1.5;background:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 10px 30px rgba(91,42,134,.12)}

/* ---- cake ---- */
.cakeWrap{margin:26px auto 0;width:260px}
.flame{transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate}
.flame:nth-of-type(2){animation-delay:.1s}.flame:nth-of-type(3){animation-delay:.2s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.out .flame{display:none}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.pill{padding:12px 18px;border-radius:999px;background:#fff;font-weight:600;font-size:16px;color:var(--plum);box-shadow:0 4px 0 #e2d3f0;border:2px solid #eadcf5}
.pill:active{transform:translateY(2px)}
.pill:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sign{font-family:'Caveat',cursive;font-size:30px;margin-top:26px;color:var(--plum)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="balloons"></div>

<main>
  <!-- ================= STEP 1: dost apni detail bharega ================= -->
  <section id="gate">
    <div class="gift">🎁</div>
    <h1>Ek surprise tumhara wait kar raha hai!</h1>
    <p>Apna naam aur birthday date daalo, phir dekho kya hota hai 😉</p>
    <form id="form" autocomplete="off">
      <label for="nm">Tumhara naam</label>
      <input id="nm" type="text" placeholder="Apna naam likho" required>
      <label for="dob">Tumhari birthday date</label>
      <input id="dob" type="date" required>
      <div id="err" role="alert"></div>
      <button class="btn" type="submit">Surprise kholo 🎉</button>
    </form>
  </section>

  <!-- ================= STEP 2: celebration ================= -->
  <section id="party">
    <div class="photoWrap">
      <div class="crown">👑</div>
      <img id="photo" alt="Birthday star">
    </div>
    <label id="photoPick">Photo nahi mili? Yahan se apni photo chuno (sirf test ke liye):
      <input type="file" id="file" accept="image/*">
    </label>

    <h2 class="hb">Happy Birthday<span class="nm" id="hbName"></span></h2>
    <div id="age"></div>
    <div id="wish" aria-live="polite"></div>

    <div class="cakeWrap" id="cake">
      <svg viewBox="0 0 260 250" width="260" height="250" role="img" aria-label="Birthday cake with candles">
        <ellipse cx="130" cy="228" rx="120" ry="14" fill="#e9d6f7"/>
        <!-- bottom tier -->
        <rect x="30" y="158" width="200" height="68" rx="14" fill="#ff8fb8"/>
        <path d="M30 172 q16 22 32 0 q16 22 32 0 q16 22 32 0 q16 22 32 0 q16 22 32 0 q16 22 32 0 v-14 h-192z" fill="#fff"/>
        <circle cx="62" cy="200" r="5" fill="#ffc83d"/><circle cx="130" cy="206" r="5" fill="#2ec4b6"/><circle cx="198" cy="200" r="5" fill="#ffc83d"/>
        <!-- top tier -->
        <rect x="62" y="104" width="136" height="58" rx="12" fill="#9b6bd3"/>
        <path d="M62 116 q11 18 22 0 q11 18 22 0 q11 18 22 0 q11 18 22 0 q11 18 22 0 q11 18 22 0 v-12 h-132z" fill="#fff"/>
        <!-- candles -->
        <rect x="88" y="72" width="10" height="34" rx="3" fill="#ffc83d"/>
        <rect x="125" y="68" width="10" height="38" rx="3" fill="#2ec4b6"/>
        <rect x="162" y="72" width="10" height="34" rx="3" fill="#ff4f8b"/>
        <g class="flames">
          <path class="flame" d="M93 52 q-9 12 0 20 q9 -8 0 -20z" fill="#ff9d1f"/>
          <path class="flame" d="M130 48 q-9 12 0 20 q9 -8 0 -20z" fill="#ff9d1f"/>
          <path class="flame" d="M167 52 q-9 12 0 20 q9 -8 0 -20z" fill="#ff9d1f"/>
        </g>
      </svg>
    </div>

    <div class="actions">
      <button class="pill" id="blow">🕯️ Candle bujhao</button>
      <button class="pill" id="boom">🎊 Aur confetti</button>
      <button class="pill" id="music">🎵 Music</button>
    </div>
    <div class="sign" id="sign"></div>
  </section>
</main>

const $ = id => document.getElementById(id);
const norm = s => s.trim().toLowerCase().replace(/\s+/g,' ');

/* ---------- confetti ---------- */
const cv = $('confetti'), cx = cv.getContext('2d');
let W, H, bits = [], running = false;
function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', size); size();
const COLORS = ['#ff4f8b','#ffc83d','#2ec4b6','#5b2a86','#ff8fb8','#6ec1ff'];
function burst(n = 140, x = W/2, y = H*0.35){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = 4 + Math.random()*9;
    bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,w:6+Math.random()*7,h:4+Math.random()*5,
      r:Math.random()*6,vr:(Math.random()-.5)*.4,c:COLORS[(Math.random()*COLORS.length)|0],life:0});
  }
  if(!running){ running = true; requestAnimationFrame(tick); }
}
function tick(){
  cx.clearRect(0,0,W,H);
  bits.forEach(b=>{
    b.vy += .22; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life++;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.w/2,-b.h/2,b.w,b.h); cx.restore();
  });
  bits = bits.filter(b => b.y < H + 40 && b.life < 400);
  if(bits.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0,0,W,H); }
}
function rain(ms = 4000){
  const t = setInterval(()=>burst(14, Math.random()*W, -10), 180);
  setTimeout(()=>clearInterval(t), ms);
}

/* ---------- balloons ---------- */
function balloons(n = 16){
  const box = $('balloons');
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const b = document.createElement('div');
      b.className = 'balloon';
      b.style.left = Math.random()*95 + '%';
      b.style.background = COLORS[(Math.random()*COLORS.length)|0];
      b.style.animationDuration = (7 + Math.random()*6) + 's';
      box.appendChild(b);
      setTimeout(()=>b.remove(), 14000);
    }, i*350);
  }
}

/* ---------- typing wish ---------- */
function typeText(el, text){
  el.textContent = ''; let i = 0;
  const t = setInterval(()=>{ el.textContent += text[i++]; if(i >= text.length) clearInterval(t); }, 38);
}

/* ---------- happy birthday tune (WebAudio, koi file nahi chahiye) ---------- */
let audio, playing = false;
function playTune(){
  if(playing) return; playing = true;
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const N = {C:261.6,D:293.7,E:329.6,F:349.2,G:392,A:440,B:493.9,C2:523.3};
  const song = [['G',.5],['G',.25],['A',.75],['G',.75],['C2',.75],['B',1.5],
                ['G',.5],['G',.25],['A',.75],['G',.75],['D',.75],['C2',1.5],
                ['G',.5],['G',.25],['G',.75],['E',.75],['C',.75],['B',.75],['A',.75],
                ['F',.5],['F',.25],['E',.75],['C',.75],['D',.75],['C',1.5]];
  let t = audio.currentTime + .05;
  song.forEach(([n,d])=>{
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle'; o.frequency.value = N[n];
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.25, t+.03); g.gain.exponentialRampToValueAtTime(.001, t + d*.55);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + d*.55 + .05);
    t += d*.6;
  });
  setTimeout(()=>playing = false, (t - audio.currentTime)*1000);
}

/* ---------- gate check ---------- */
function ageText(){
  const [y,m,d] = CONFIG.birthday.split('-').map(Number);
  const age = new Date().getFullYear() - y;
  return (CONFIG.checkYear && age > 0 && age < 120) ? `Aaj tum ${age} saal ke ho gaye! 🎈` : '';
}
function matches(name, dob){
  const typed = norm(name), real = norm(CONFIG.friendName);
  const okName = typed === real || typed === real.split(' ')[0];
  const [y,m,d] = CONFIG.birthday.split('-');
  const [ty,tm,td] = dob.split('-');
  const okDate = m === tm && d === td && (!CONFIG.checkYear || y === ty);
  return okName && okDate;
}

$('form').addEventListener('submit', e=>{
  e.preventDefault();
  if(!matches($('nm').value, $('dob').value)){
    $('err').textContent = 'Hmm, ye detail match nahi hui. Naam ya date dobara check karo 😄';
    $('gate').classList.remove('shake'); void $('gate').offsetWidth; $('gate').classList.add('shake');
    return;
  }
  reveal();
});

function reveal(){
  $('gate').style.display = 'none';
  $('party').classList.add('on');
  $('hbName').textContent = CONFIG.friendName + '! 🎉';
  $('age').textContent = ageText();
  $('sign').textContent = '— ' + CONFIG.fromName + ' ❤️';
  const img = $('photo');
  img.onerror = () => $('photoPick').classList.add('show');
  img.src = CONFIG.photo;
  burst(220); setTimeout(()=>burst(160, W*0.2, H*0.5), 500); setTimeout(()=>burst(160, W*0.8, H*0.5), 900);
  balloons(); rain();
  setTimeout(()=>typeText($('wish'), CONFIG.wish), 900);
  scrollTo({top:0});
}

/* ---------- buttons ---------- */
$('blow').onclick = () => {
  const c = $('cake'); const out = c.classList.toggle('out');
  $('blow').textContent = out ? '🔥 Wapas jalao' : '🕯️ Candle bujhao';
  if(out){ burst(200); balloons(8); }
};
$('boom').onclick  = () => { burst(220); rain(2500); };
$('music').onclick = playTune;
$('file').onchange = e => {
  const f = e.target.files[0]; if(f) $('photo').src = URL.createObjectURL(f);
};
